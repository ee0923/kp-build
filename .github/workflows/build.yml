name: Build KeePass

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      target:
        description: Platforms to build
        type: choice
        options: [all, android, desktop, linux, macos, windows]
        default: all

permissions:
  contents: read

concurrency:
  group: keepass-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  VCPKG_DISABLE_METRICS: '1'
  HOMEBREW_NO_ANALYTICS: '1'
  POWERSHELL_TELEMETRY_OPTOUT: '1'

defaults:
  run:
    shell: bash

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: select
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: python3 scripts/build-matrix.py "$TARGET" >> "$GITHUB_OUTPUT"
      - name: Download audit fixture
        run: |
          mkdir fixtures
          curl --fail --silent --show-error --location --max-time 60 \
            https://api.nuget.org/v3-flatcontainer/xamarin.androidx.activity/1.9.3.2/xamarin.androidx.activity.1.9.3.2.nupkg \
            -o fixtures/activity.nupkg
          curl --fail --silent --show-error --location --max-time 60 \
            https://api.nuget.org/v3-flatcontainer/xamarin.kotlin.stdlib/2.0.21.2/xamarin.kotlin.stdlib.2.0.21.2.nupkg \
            -o fixtures/kotlin.nupkg
      - name: Test artifact audit
        run: >-
          docker run --rm --network=none -v "$PWD/scripts:/audit:ro" -v "$PWD/fixtures:/fixtures:ro"
          -e ANDROIDX_AUDIT_FIXTURE=/fixtures/activity.nupkg
          -e KOTLIN_AUDIT_FIXTURE=/fixtures/kotlin.nupkg
          python:3.12-slim python -B /audit/test-artifacts.py
      - name: Test release publishing
        run: >-
          docker run --rm --network=none -v "$PWD/scripts:/audit:ro"
          python:3.12-slim python -B /audit/test-release.py

  build:
    name: ${{ matrix.name }} (${{ matrix.arch }})
    needs: matrix
    permissions:
      contents: write
    env:
      APP: ${{ matrix.app }}
      KEEPASS_BUILD_PLATFORM: ${{ matrix.platform }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg
      VCPKG_MAX_CONCURRENCY: '2'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    concurrency:
      group: keepass-${{ github.ref }}-${{ matrix.id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Clone locked upstream
        env:
          APP: ${{ matrix.app }}
        run: python3 scripts/checkout-source.py "$APP"
      - name: Customize source
        env:
          PATCH_BOOTSTRAP: ${{ secrets[matrix.secret] }}
        run: bash scripts/apply-patch.sh
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.platform == 'android'
        with:
          dotnet-version: '9.0.320'
      - name: Install pinned Android toolchain
        if: matrix.platform == 'android'
        run: |
          printf '%s\n' '{"sdk":{"version":"9.0.320","rollForward":"disable"}}' > global.json
          dotnet workload install android --skip-manifest-update
          "${ANDROID_HOME:?Android SDK required}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install \
            'platforms;android-35' 'platforms;android-36' \
            'build-tools;34.0.0' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: bash scripts/setup-linux.sh
      - name: Install macOS build tools
        if: matrix.platform == 'macos'
        run: brew install cmake ninja asciidoctor pkg-config autoconf autoconf-archive automake libtool nasm
      - name: Set up Windows compiler
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/setup-windows.ps1
      - name: Install Windows documentation tool
        if: matrix.platform == 'windows'
        run: gem install asciidoctor --no-document
      - name: Clone locked vcpkg
        if: matrix.platform == 'macos' || matrix.platform == 'windows'
        run: |
          python3 scripts/checkout-source.py vcpkg vcpkg
          mkdir -p .cache/vcpkg
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.platform == 'macos' || matrix.platform == 'windows'
        with:
          path: .cache/vcpkg
          key: vcpkg-${{ matrix.id }}-${{ runner.arch }}-${{ hashFiles('sources.lock.json') }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ matrix.id }}-${{ runner.arch }}-${{ hashFiles('sources.lock.json') }}-
      - name: Bootstrap vcpkg on macOS
        if: matrix.platform == 'macos'
        run: bash vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Bootstrap vcpkg on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: bash scripts/build.sh build
      - name: Run tests
        run: bash scripts/build.sh test
      - name: Audit
        run: bash scripts/build.sh audit
      - name: Package
        run: bash scripts/build.sh package
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.app }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified package to Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
          PACKAGE_ID: ${{ matrix.id }}
        run: bash scripts/publish-release.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.id }}
          path: |
            reports/*.trx
            build/Testing/Temporary/LastTest.log
            build/vcpkg-manifest-install.log
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
